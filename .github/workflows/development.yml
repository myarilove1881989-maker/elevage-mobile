name: Development validation
on:
  pull_request:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: development-${{ github.ref }}
  cancel-in-progress: true
jobs:
  targeted-flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: test "$(git -C "$FLUTTER_ROOT" rev-parse HEAD)" = 5fc346839b5d0eef006ed8404392afb4dfae428d
      - run: python3 tools/guard_push.py --check
      - run: flutter pub get --enforce-lockfile
      - run: flutter test --no-pub --concurrency=1 test/farm_name_test.dart test/laying_offline_preparation_test.dart test/production_tracking_test.dart test/egg_production_test.dart test/stock_checkpoint_test.dart test/terrain_stock_projection_test.dart test/password_reset_test.dart test/reset_password_link_test.dart test/auth_connection_test.dart test/permission_contract_test.dart test/financial_indicators_test.dart test/production_network_safety_test.dart
      - run: flutter test --no-pub --platform chrome test/web_j1_qualification_test.dart test/day1_agenda_test.dart test/auth_connection_test.dart test/password_reset_test.dart
